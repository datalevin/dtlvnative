[package]
name = "dtlvnative-sys"
description = "Raw bindings to Datalevin's DLMDB, USearch, and llama native interfaces"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
include = ["Cargo.toml", "src/**", "build.rs", "artifact.rs", "native-artifacts.json", "bindings/**", "tests/**", "README.md", "LICENSE"]
links = "dtlvnative"
build = "build.rs"

[features]
default = ["dlmdb"]
dlmdb = []
usearch = ["dep:libloading"]
llama = ["dep:libloading"]
full = ["dlmdb", "usearch", "llama"]

[dependencies]
libloading = { workspace = true, optional = true }

[build-dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
flate2.workspace = true
tar.workspace = true

[dev-dependencies]
tempfile.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
flate2.workspace = true
tar.workspace = true

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]

[lints]
workspace = true
