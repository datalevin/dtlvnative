[package]
name = "dtlvnative"
description = "Rust interfaces to Datalevin's native dependencies"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
include = ["Cargo.toml", "src/**", "tests/**", "examples/**", "README.md", "LICENSE"]

[features]
default = ["dlmdb"]
dlmdb = ["dtlvnative-sys/dlmdb"]
usearch = ["dtlvnative-sys/usearch"]
llama = ["dtlvnative-sys/llama"]
full = ["dlmdb", "usearch", "llama"]

[dependencies]
dtlvnative-sys = { path = "../dtlvnative-sys", version = "=1.1.1", default-features = false }

[dev-dependencies]
tempfile.workspace = true

[[example]]
name = "storage"
required-features = ["dlmdb"]

[[test]]
name = "storage"
required-features = ["dlmdb"]

[[example]]
name = "storage_fixture"
required-features = ["dlmdb"]

[[test]]
name = "usearch"
required-features = ["usearch"]

[[test]]
name = "llama"
required-features = ["llama"]

[[example]]
name = "vector_fixture"
required-features = ["usearch"]

[[example]]
name = "models"
required-features = ["llama"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]
